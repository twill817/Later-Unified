<title>Later One</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: Later-style app shell. White left sidebar of spokes, white top bar, light gray canvas with soft white cards. Purple = action + selection; black icon tiles on metric cards; yellow/green/pink/lavender for charts and spoke families. */
:root{
  --bg:#F2F2F3;--panel:#FFFFFF;--sunk:#F5F4F8;--line:#E8E6EE;--line2:#D6D3DE;
  --ink:#121214;--ink2:#4E4C57;--ink3:#7F7D89;
  --accent:#5A2BD8;--accent-ink:#4A1FC3;--accent-soft:#EEE8FD;--on-accent:#FFFFFF;
  --tile:#121214;--on-tile:#FFFFFF;
  --pub:#1C9660;--pub-soft:#DEF4E8;--grow:#A26F04;--grow-soft:#FFF1CF;--crt:#CF3F78;--crt-soft:#FDE4EE;
  --ok:#1B8551;--ok-soft:#DCF3E6;--warn:#94600E;--warn-soft:#FDF0D4;--bad:#C53A3A;--bad-soft:#FCE3E3;
  --c1:#FFC95C;--c2:#4FBF8B;--c3:#F78FB3;--c4:#9C84E2;--c5:#CFCAD9;
  --shadow:0 1px 2px rgba(18,18,30,.05),0 3px 12px rgba(18,18,30,.04);
  --scrim:rgba(14,14,22,.42);
  --f-body:"Inter","Helvetica Neue","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E11;--panel:#18181D;--sunk:#202027;--line:#2B2A33;--line2:#3B3A46;
  --ink:#F2F1F5;--ink2:#BEBBC8;--ink3:#8E8B99;
  --accent:#8F6BFF;--accent-ink:#C6B3FF;--accent-soft:#2A2050;--on-accent:#FFFFFF;
  --tile:#F2F1F5;--on-tile:#121214;
  --pub:#4BCB8C;--pub-soft:#13311F;--grow:#EBB64D;--grow-soft:#342812;--crt:#F27CAA;--crt-soft:#3B1829;
  --ok:#55CF8D;--ok-soft:#133120;--warn:#E7B357;--warn-soft:#332611;--bad:#F27575;--bad-soft:#391717;
  --c1:#F0BC52;--c2:#4AB884;--c3:#EE82AA;--c4:#9C84E2;--c5:#4A4757;
  --shadow:none;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E11;--panel:#18181D;--sunk:#202027;--line:#2B2A33;--line2:#3B3A46;
  --ink:#F2F1F5;--ink2:#BEBBC8;--ink3:#8E8B99;
  --accent:#8F6BFF;--accent-ink:#C6B3FF;--accent-soft:#2A2050;--on-accent:#FFFFFF;
  --tile:#F2F1F5;--on-tile:#121214;
  --pub:#4BCB8C;--pub-soft:#13311F;--grow:#EBB64D;--grow-soft:#342812;--crt:#F27CAA;--crt-soft:#3B1829;
  --ok:#55CF8D;--ok-soft:#133120;--warn:#E7B357;--warn-soft:#332611;--bad:#F27575;--bad-soft:#391717;
  --c1:#F0BC52;--c2:#4AB884;--c3:#EE82AA;--c4:#9C84E2;--c5:#4A4757;
  --shadow:none;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-body);margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.015em}
h2{font-size:16px;line-height:1.3;font-weight:700}
h3{font-size:14px;font-weight:600}
p{margin:0}
.mono,.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12.5px;color:var(--ink2);font-weight:500}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;max-width:1440px;margin:0 auto;align-items:start}
.rail{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:16px 12px 12px;display:flex;flex-direction:column;gap:2px;height:calc(100vh - 32px);overflow:auto}
.mark{display:flex;align-items:center;gap:7px;padding:2px 10px 14px}
.mark b{font:900 27px/1 var(--f-body);letter-spacing:-.06em;color:var(--ink)}
.mark .one,.mmark .one{display:inline-grid;place-items:center;height:22px;padding:0 7px;border-radius:6px;background:var(--accent);color:var(--on-accent);font:800 13px/1 var(--f-body);letter-spacing:-.01em;transform:translateY(1px)}
.rail .sect{padding:10px 10px 4px;font-size:12px;color:var(--ink3);font-weight:500;border-top:1px solid var(--line);margin-top:8px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:7px 10px;border:0;border-radius:8px;background:none;color:var(--ink);font-weight:500;font-size:14.5px;text-align:left;white-space:nowrap}
.nav:hover{background:var(--sunk)}
.nav .svg{color:var(--ink)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav.on .svg{color:var(--accent)}
.nav .badge{margin-left:auto}
.nav.dim{color:var(--ink2)}.nav.dim .svg{color:var(--ink3)}
.f-pub{--fam:var(--pub);--fam-soft:var(--pub-soft)}
.f-grow{--fam:var(--grow);--fam-soft:var(--grow-soft)}
.f-crt{--fam:var(--crt);--fam-soft:var(--crt-soft)}
.f-hub{--fam:var(--accent);--fam-soft:var(--accent-soft)}
.notifnav{margin-top:8px}
.railnav{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.rail{overflow:hidden}
.concept{padding:8px 10px 6px!important;padding:14px 10px 8px;font-size:11.5px;color:var(--ink3);line-height:1.45}
.wsw{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:12px 6px 2px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.wsw .sq{width:40px;height:40px;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;border-radius:4px;font-size:16px;flex:none}
.wsw b{display:block;font-size:13.5px;font-weight:600}.wsw small{display:block;color:var(--ink2);font-size:12.5px}
.wsw{border-radius:0}.wsw:hover b{color:var(--accent)}

.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 4px}
.ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);flex:none}
.who select{border:0;background:transparent;font-weight:600;padding:2px;max-width:230px}
.searchbtn{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink3);text-align:left}
.searchbtn kbd{margin-left:auto;font:500 11px var(--f-body);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;background:var(--panel)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ink{background:var(--tile);border-color:var(--tile);color:var(--on-tile)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:7px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.iconbtn{position:relative;width:38px;height:38px;display:grid;place-items:center;border:0;background:transparent;border-radius:8px;color:var(--ink)}
.iconbtn:hover{background:var(--sunk)}
.iconbtn .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:260px;box-shadow:0 12px 32px rgba(10,10,24,.14);z-index:20}
.menu button{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left}
.menu button:hover{background:var(--accent-soft)}
.menu small{display:block;color:var(--ink3);font-size:12px}
.rel{position:relative}
.help{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:8px;background:var(--tile);color:var(--on-tile);border:0;border-radius:99px;padding:11px 18px 11px 14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18)}

.card{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:20px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.g2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px}
.g2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.kpi{position:relative;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:22px 20px;display:grid;grid-template-columns:48px minmax(0,1fr);column-gap:16px;align-content:center}
.kpi>*{grid-column:2}
.kpi::before{content:"";grid-column:1;grid-row:1/span 3;align-self:center;width:48px;height:48px;border-radius:8px;background:var(--tile)}
.kpi::after{content:"";position:absolute;left:32px;top:50%;width:24px;height:24px;margin-top:-12px;background:var(--on-tile);-webkit-mask:var(--ki,var(--k2)) center/contain no-repeat;mask:var(--ki,var(--k2)) center/contain no-repeat}
.kpi:nth-child(5n+1){--ki:var(--k1)}.kpi:nth-child(5n+2){--ki:var(--k2)}.kpi:nth-child(5n+3){--ki:var(--k3)}.kpi:nth-child(5n+4){--ki:var(--k4)}.kpi:nth-child(5n+5){--ki:var(--k5)}
.kpi[style]{display:block;box-shadow:none;background:var(--sunk);border-radius:10px}
.kpi[style]::before,.kpi[style]::after{display:none}
.kpi .v{font-size:24px;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px}
.kpi .d{font-size:12.5px;margin-top:6px;color:var(--ink2)}
.kpi .d.up::before{content:"↗";display:inline-block;margin-right:6px;padding:1px 7px;border-radius:99px;background:var(--ok-soft);color:var(--ok);font-size:11px;font-weight:600}
.kpi .d.up{color:var(--ink2)}
.up{color:var(--ok)}.down{color:var(--bad)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head p{max-width:66ch;margin-top:4px}
.famtag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--fam)}
.famtag i{width:8px;height:8px;border-radius:2px;background:var(--fam)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.fam{background:var(--fam-soft);color:var(--fam)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.plat{display:inline-grid;place-items:center;height:18px;min-width:24px;padding:0 4px;border-radius:4px;background:var(--sunk);font-size:10px;font-weight:600;color:var(--ink2)}

/* hub */
.queue{display:flex;flex-direction:column}
.qi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 4px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.qi:first-child{border-top:0}
.qi:hover .qt{color:var(--accent)}
.qi .ico{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--fam-soft);color:var(--fam)}
.qi .ico.bad{background:var(--bad-soft);color:var(--bad)}
.qi .ico.warn{background:var(--warn-soft);color:var(--warn)}
.qt{font-weight:600}
.qm{font-size:13px;color:var(--ink2)}
.spokes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.spoke{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--panel);border:1px solid transparent;border-radius:12px;box-shadow:var(--shadow);padding:18px;min-height:126px}
.spoke:hover{border-color:var(--accent)}
.spoke .t{display:flex;align-items:center;gap:10px;font-weight:600}
.spoke .t .svg{color:var(--fam);width:20px;height:20px}
.spoke .s{font-size:22px;font-weight:600;margin-top:auto;font-variant-numeric:tabular-nums}
.spoke .c{font-size:12.5px;color:var(--ink2)}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.loop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.loop div{border-radius:10px;padding:12px;background:var(--fam-soft);color:var(--fam);font-size:12.5px;font-weight:600}
.loop b{display:block;font-size:16px;color:var(--ink)}

.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.barrow{display:grid;grid-template-columns:90px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px;padding:5px 0}

.chart{width:100%;height:auto;display:block}
.chart text{font-size:11px;fill:var(--ink3);font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:7px}

/* calendar */
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cal{display:grid;grid-template-columns:repeat(7,minmax(138px,1fr));gap:1px;min-width:1000px;background:var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.day{background:var(--panel);padding:10px 8px;display:flex;flex-direction:column;gap:6px;min-height:320px}
.day.today .dh b{background:var(--accent);color:var(--on-accent);border-radius:99px;padding:1px 8px}
.dh{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px}
.dh b{font-size:13.5px;font-weight:600}
.best{font-size:11px;font-weight:600;color:var(--accent);padding:3px 6px;background:var(--accent-soft);border-radius:6px;text-align:center}
.post{display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.post:hover{border-color:var(--accent)}
.post .tm{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);font-weight:500}
.post .tt{font-size:12.5px;font-weight:600;line-height:1.3}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink3)}
.s-scheduled{background:var(--c4)}.s-approval{background:var(--accent)}.s-draft{background:var(--c5)}.s-published{background:var(--c2)}.s-failed{background:var(--bad)}.s-changes{background:var(--c1)}
.chips{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow-x:auto;max-width:100%;background:var(--panel)}
.chip{border:0;border-right:1px solid var(--line2);background:var(--panel);padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.chip:last-child{border-right:0}
.chip:hover{background:var(--sunk)}
.chip.on{background:var(--accent-soft);color:var(--accent)}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12.5px;color:var(--ink2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}

.inbox{display:grid;grid-template-columns:290px minmax(0,1fr) 270px;min-height:560px}
.inbox > *{min-width:0}
.ilist{border-right:1px solid var(--line);display:flex;flex-direction:column}
.conv{display:flex;gap:10px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.conv.on{background:var(--accent-soft)}
.conv .n{font-weight:600;display:flex;gap:6px;align-items:center}
.conv .x{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:6px}
.thread{display:flex;flex-direction:column}
.msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
.msg{max-width:78%;padding:9px 12px;border-radius:12px;background:var(--panel);font-size:13.5px;box-shadow:var(--shadow)}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent)}
.msg small{display:block;font-size:11px;opacity:.75;margin-top:3px}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.compose input{flex:1 1 200px;min-width:0;border:1px solid var(--line2);border-radius:8px;padding:9px 12px;background:var(--panel)}
.ctx{border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
.sugg{border:1px dashed var(--fam);border-radius:10px;padding:10px;font-size:13px;background:var(--fam-soft)}

.kanban{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;min-width:980px}
.col{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.col h3{display:flex;justify-content:space-between;padding:2px 4px 4px;font-size:13px}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.kc .h{display:flex;gap:8px;align-items:center}
.fit{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}

.lib{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.phone{width:100%;max-width:300px;justify-self:center;border:10px solid var(--tile);border-radius:36px;background:var(--panel);padding:18px 14px;display:flex;flex-direction:column;gap:10px;min-height:560px}
.phone .pfp{width:60px;height:60px;border-radius:50%;margin:4px auto 0;display:grid;place-items:center;font-size:20px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pb{border:1px solid var(--line2);border-radius:10px;padding:10px;font-size:12.5px;font-weight:600;text-align:center}

/* ---------- charts ---------- */
function lineChart(series,labels,opts={}){
 const W=640,H=230,L=46,R=14,T=14,B=30;
 const all=series.flatMap(s=>s.v);const max=Math.ceil(Math.max(...all)*1.12/ (opts.step||10))*(opts.step||10);
 const x=i=>L+i*(W-L-R)/(labels.length-1),y=v=>T+(H-T-B)*(1-v/max);
 const ticks=[0,max/2,max];
 let g=ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${opts.fmt?opts.fmt(t):t}</text>`).join('');
 g+=labels.map((l,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`).join('');
 const paths=series.map((s,si)=>{
  const d=s.v.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area=si===0?`<path d="${d} L${x(s.v.length-1)} ${y(0)} L${x(0)} ${y(0)} Z" fill="${s.c}" opacity=".1"/>`:'';
  const li=s.v.length-1;
  return `${area}<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 5"':''}/><circle cx="${x(li)}" cy="${y(s.v[li])}" r="4" fill="${s.c}"/>`;
 }).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'Trend chart')}">${g}${paths}</svg>`;
}
function bars(series,labels,opts={}){
 const W=640,H=240,L=46,R=10,T=12,B=30;const tot=labels.map((_,i)=>series.reduce((a,s)=>a+s.v[i],0));
 const st=opts.step||20,max=Math.ceil(Math.max(...tot)*1.08/st)*st;const slot=(W-L-R)/labels.length,bw=slot*.72;const y=v=>T+(H-T-B)*(1-v/max);
 let g=[0,max/2,max].map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${opts.fmt?opts.fmt(t):t}</text>`).join('');
 labels.forEach((l,i)=>{const x=L+i*slot+(slot-bw)/2;let acc=0;series.forEach(s=>{const v=s.v[i];g+=`<rect x="${x.toFixed(1)}" y="${y(acc+v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(acc)-y(acc+v)).toFixed(1)}" fill="${s.c}"><title>${s.n}: ${v}K</title></rect>`;acc+=v});g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-9}" text-anchor="middle">${l}</text>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'Stacked bar chart')}">${g}</svg>`;
}

function countUp(root){
 const els=root.querySelectorAll('.kpi .v,.spoke .s,.cu');const t0=performance.now(),D=1700;
 const jobs=[...els].map(el=>{const m=el.textContent.trim().match(/^([^\d]*?)([\d,]*\.?\d+)(.*)$/);if(!m)return null;const raw=m[2],dec=(raw.split('.')[1]||'').length;return {el,pre:m[1],n:parseFloat(raw.replace(/,/g,'')),dec,g:raw.includes(','),suf:m[3]}}).filter(Boolean);
 const f=(j,v)=>j.pre+v.toLocaleString('en-US',{minimumFractionDigits:j.dec,maximumFractionDigits:j.dec,useGrouping:j.g})+j.suf;
 jobs.forEach(j=>j.el.textContent=f(j,0));
 const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);jobs.forEach(j=>j.el.textContent=f(j,j.n*e));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step);
}
